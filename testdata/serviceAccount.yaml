---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: test-namespace
  name: update-deployments
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["nginx"]
  verbs: ["get", "update", "patch"]
# Kubernetes authorizes server-side apply creation separately; create cannot
# be restricted by resourceNames. Keep this permission namespace-scoped.
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create"]

---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: deploy
  namespace: test-namespace
---
apiVersion: v1
kind: Secret
metadata:
  name: deploy
  namespace: test-namespace
  annotations:
    kubernetes.io/service-account.name: deploy
type: kubernetes.io/service-account-token

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deploy
  namespace: test-namespace
subjects:
- kind: ServiceAccount
  name: deploy
  namespace: test-namespace
roleRef:
  kind: Role
  name: update-deployments
  apiGroup: rbac.authorization.k8s.io
